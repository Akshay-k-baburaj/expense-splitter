spring.application.name=expense-splitter
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/expense_splitter_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Comma-separated browser origins allowed to call the API. Set APP_CORS_ALLOWED_ORIGINS in production.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

auth0.issuer-uri=${AUTH0_ISSUER_URI:}
auth0.jwks-uri=${AUTH0_JWKS_URI:}
auth0.audience=${AUTH0_AUDIENCE:}
auth0.claims.email=${AUTH0_EMAIL_CLAIM:https://expense-splitter.example/claims/email}
auth0.claims.email-verified=${AUTH0_EMAIL_VERIFIED_CLAIM:https://expense-splitter.example/claims/email_verified}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

